<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">XSS Web Scanner</title>
  <desc id="desc">Cybersecurity banner for XSS Web Scanner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#ff5252"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b0ff"/>
      <stop offset="1" stop-color="#536dfe"/>
    </linearGradient>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="24" fill="url(#bg)"/>
  <g opacity=".16" stroke="#4b5563">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600"/>
    <path d="M160 0V500M320 0V500M480 0V500M640 0V500M800 0V500M960 0V500M1120 0V500M1280 0V500M1440 0V500"/>
  </g>

  <path d="M0 420L420 0" stroke="url(#red)" stroke-width="3" opacity=".65" filter="url(#glowRed)"/>
  <path d="M1180 500L1600 80" stroke="url(#blue)" stroke-width="3" opacity=".65" filter="url(#glowBlue)"/>

  <g transform="translate(150 105)">
    <path d="M120 0L230 42V145C230 220 174 270 120 300C66 270 10 220 10 145V42Z" fill="#0b1220" stroke="url(#red)" stroke-width="8" filter="url(#glowRed)"/>
    <path d="M120 34L195 62V143C195 194 158 228 120 252C82 228 45 194 45 143V62Z" fill="#121a2a" stroke="#00b0ff" stroke-width="3"/>
    <text x="120" y="155" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900">XSS</text>
    <path d="M75 182L108 215L174 133" fill="none" stroke="#ff1744" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(480 130)">
    <text x="0" y="0" fill="#9ca3af" font-family="monospace" font-size="18">WEB APPLICATION SECURITY / AUTOMATED ASSESSMENT</text>
    <text x="0" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900">XSS WEB SCANNER</text>
    <rect x="0" y="108" width="660" height="4" rx="2" fill="url(#red)"/>
    <text x="0" y="160" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="26">Discovery • Validation • Evidence • Reporting</text>
    <text x="0" y="214" fill="#64748b" font-family="monospace" font-size="18">PYTHON  /  SELENIUM  /  BEAUTIFULSOUP  /  REQUESTS</text>
  </g>

  <g transform="translate(1170 118)" fill="none">
    <rect width="300" height="210" rx="14" fill="#0a101c" stroke="#263449" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="32" rx="14" fill="#121c2d"/>
    <circle cx="20" cy="16" r="5" fill="#ff1744"/>
    <circle cx="38" cy="16" r="5" fill="#ffca28"/>
    <circle cx="56" cy="16" r="5" fill="#00c853"/>
    <path d="M25 76L42 92L25 108" stroke="#00b0ff" stroke-width="5"/>
    <path d="M54 112H112" stroke="#ff1744" stroke-width="5"/>
    <path d="M25 142H230M25 166H190M25 190H245" stroke="#334155" stroke-width="4"/>
  </g>

  <g transform="translate(480 410)" font-family="monospace" font-size="16" fill="#94a3b8">
    <text x="0">[XSS]</text><text x="70">[CRAWLER]</text><text x="200">[FORMS]</text><text x="315">[EVIDENCE]</text><text x="455">[REPORT]</text>
  </g>

  <rect x="1.5" y="1.5" width="1597" height="497" rx="23" fill="none" stroke="#243044" stroke-width="3"/>
</svg>